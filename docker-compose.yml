services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: qshield-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=qshield-quantum-secure-secret-key-2026-super-secure
      - DATABASE_PATH=/app/data/qshield.db
    volumes:
      - qshield-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: qshield-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qshield-data:
